name: Frontend Verify

on:
  push:
    paths:
      - "app/**"
      - "components/**"
      - "e2e/**"
      - "lib/**"
      - "pages/**"
      - "public/**"
      - "middleware.ts"
      - "next.config.*"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.*"
      - "playwright.config.ts"
      - ".github/workflows/frontend-verify.yml"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "e2e/**"
      - "lib/**"
      - "pages/**"
      - "public/**"
      - "middleware.ts"
      - "next.config.*"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.*"
      - "playwright.config.ts"
      - ".github/workflows/frontend-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_RITMO_API_URL: "http://127.0.0.1:65535"
      NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke
        run: npm run test:e2e:smoke
